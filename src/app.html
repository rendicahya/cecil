<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#FFF3B0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Baloo+2:wght@500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('cecil-theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
			(function () {
				try {
					var stored = localStorage.getItem('cecil-language');
					var lang =
						stored === 'id' || stored === 'en'
							? stored
							: navigator.language.toLowerCase().indexOf('en') === 0
								? 'en'
								: 'id';
					document.documentElement.lang = lang;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="font-sans" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
